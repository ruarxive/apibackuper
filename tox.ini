# Run tests across supported Python versions with the shared pyproject settings.
# Usage: tox, tox -e py313, tox -e lint, tox -e format, tox -e typecheck

[tox]
envlist =
    py310,
    py311,
    py312,
    py313,
    lint,
    format,
    typecheck
minversion = 4.0

[testenv]
extras = dev
commands =
    pytest {posargs:./apibackuper ./tests}
setenv =
    PYTHONUNBUFFERED = 1
passenv =
    CI
    GITHUB_*

[testenv:lint]
commands =
    flake8 apibackuper scripts
    bandit -r apibackuper -ll

[testenv:format]
commands =
    black --check apibackuper scripts
    isort --check-only apibackuper scripts

[testenv:typecheck]
commands =
    mypy apibackuper

[testenv:coverage]
commands =
    coverage combine
    coverage report
    coverage html
    coverage xml
