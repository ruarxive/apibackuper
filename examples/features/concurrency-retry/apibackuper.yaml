settings:
  name: hubofdata-concurrency-retry

project:
  description: Хаб открытых данных datasets
  url: https://hubofdata.ru/api/3/action/package_search
  http_mode: GET
  work_modes: full,incremental,update
  iterate_by: skip

params:
  page_size_param: rows
  page_size_limit: 100
  count_skip_param: start

data:
  total_number_key: result.count
  data_key: result.results
  item_key: id
  change_key: metadata_modified

request:
  parallelism: 10
  retry:
    max_retries: 5
    backoff_strategy: exponential
    initial_delay: 1
    max_delay: 30
    retry_on_status: [429, 500, 502, 503, 504]

rate_limit:
  enabled: true
  requests_per_second: 5

storage:
  storage_type: zip
